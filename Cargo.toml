[package]
name = "hyprhyde"
version = "0.1.0"
edition = "2024"
description = "Collapse Hyprland windows into round bubbles in a screen corner"
license = "MIT"
repository = "https://github.com/1-Bart-1/hyprhyde"

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
