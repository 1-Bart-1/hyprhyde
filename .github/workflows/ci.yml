name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo chmod 666 /dev/kvm
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: tests/e2e/out
